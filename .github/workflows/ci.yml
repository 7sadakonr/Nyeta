name: CI Pipeline

on:
  push:
    branches: [ main, master, feature/** ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Unit Tests & Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit Tests (Vitest)
        run: npm run test

      - name: Validate Next.js Build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'test-key' }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET || 'ci-test-secret-key-32-chars-long' }}
        run: npm run build

  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        env:
          GEMINI_API_KEY: 'test-key'
          SESSION_SECRET: 'ci-test-secret-key-32-chars-long'
          NEXT_PUBLIC_PUSHER_KEY: 'ci-mock-pusher-key'
          NEXT_PUBLIC_PUSHER_CLUSTER: 'ap1'
        run: npm run test:e2e
